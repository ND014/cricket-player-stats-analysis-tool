name: Daily T20 Match Data Sync

on:
  schedule:
    # Runs daily at midnight UTC (05:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allows manual one-click trigger from GitHub Actions tab

jobs:
  sync:
    name: Fetch & Ingest Recent Matches
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Run Daily Match Sync
        run: |
          python sync_daily_matches.py --days 2

      - name: Check for Changes & Commit Sync Log
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage sync updates
          git add data/incoming_matches/ sync_log.md || true
          
          if git diff --staged --quiet; then
            echo "No new matches added today. Repository is up to date."
          else
            git commit -m "chore(data): auto-sync latest T20 match deliveries [skip ci]"
            git push origin main
          fi
